<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Kutu Parkur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameCanvas {
            background-color: #ffffff;
            border: 2px solid #000000;
            display: block;
            max-width: 100%;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            padding: 15px;
            background-color: #ffffff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            width: 70px;
            height: 70px;
            font-size: 24px;
            font-weight: bold;
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button id="leftBtn">◀</button>
            <button id="rightBtn">▶</button>
        </div>
        <div class="btn-group">
            <button id="jumpBtn">⬆</button>
            <button id="attackBtn">⚔️</button>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let distance = 0;
let gameOver = false;

// Oyuncu Kutusu
const player = {
    x: 100,
    y: 200,
    width: 40,
    height: 40,
    color: "#0000ff", // Mavi Kutu
    dx: 0,
    dy: 0,
    speed: 5,
    jumpPower: -12,
    grounded: false,
    facing: 1,
    isAttacking: false,
    attackTimer: 0
};

const gravity = 0.6;

// Platform Kutuları
let platforms = [
    { x: 0, y: 340, width: 900, height: 60 },
    { x: 350, y: 250, width: 120, height: 20 },
    { x: 600, y: 190, width: 140, height: 20 }
];

// Düşman Kutuları
let enemies = [
    { x: 500, y: 300, width: 40, height: 40, color: "#008000", speed: 1.5, alive: true }, // Yeşil Kutu
    { x: 750, y: 300, width: 40, height: 40, color: "#ff0000", speed: 2.0, alive: true }  // Kırmızı Kutu
];

const keys = {};

// Klavye Kontrolleri
window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Space" || e.code === "KeyJ") attack();
});

window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
});

// Ekran Butonları
function bindBtn(id, code) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[code] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[code] = false; });
    btn.addEventListener("mousedown", () => keys[code] = true);
    btn.addEventListener("mouseup", () => keys[code] = false);
}

bindBtn("leftBtn", "ArrowLeft");
bindBtn("rightBtn", "ArrowRight");

document.getElementById("jumpBtn").addEventListener("click", () => jump());
document.getElementById("attackBtn").addEventListener("click", () => attack());

function jump() {
    if (player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
    }
}

function attack() {
    if (player.isAttacking) return;
    player.isAttacking = true;
    player.attackTimer = 12;

    let attackX = player.facing > 0 ? player.x + player.width : player.x - 30;
    let attackWidth = 30;

    enemies.forEach(e => {
        if (e.alive &&
            attackX < e.x + e.width &&
            attackX + attackWidth > e.x &&
            player.y < e.y + e.height &&
            player.y + player.height > e.y) {
            e.alive = false;
            score += 10;
        }
    });
}

function generateNewWorld() {
    let lastPlatform = platforms[platforms.length - 1];
    if (lastPlatform.x < canvas.width + 200) {
        let newX = lastPlatform.x + lastPlatform.width + Math.random() * 80 + 40;
        let newWidth = Math.random() * 200 + 100;
        let newY = Math.random() * 120 + 200;

        // Bazen ana zemin seviyesinde yap
        if (Math.random() > 0.4) newY = 340;

        platforms.push({ x: newX, y: newY, width: newWidth, height: newY === 340 ? 60 : 20 });

        // Düşman ekle
        if (Math.random() > 0.3) {
            let enemyType = Math.random() > 0.5 ? "#008000" : "#ff0000";
            enemies.push({
                x: newX + newWidth / 2,
                y: newY - 40,
                width: 40,
                height: 40,
                color: enemyType,
                speed: Math.random() * 1.5 + 1,
                alive: true
            });
        }
    }
}

function update() {
    if (gameOver) return;

    // İleri / Geri Hareket
    if (keys["ArrowLeft"] || keys["KeyA"]) {
        player.dx = -player.speed;
        player.facing = -1;
    } else if (keys["ArrowRight"] || keys["KeyD"]) {
        player.dx = player.speed;
        player.facing = 1;
    } else {
        player.dx = 0;
    }

    if ((keys["ArrowUp"] || keys["KeyW"]) && player.grounded) {
        jump();
    }

    player.x += player.dx;
    player.dy += gravity;
    player.y += player.dy;

    // Ekran Kaydırma (Sonsuz İlerleme)
    if (player.x > 300) {
        let diff = player.x - 300;
        player.x = 300;
        distance += Math.floor(diff / 10);

        platforms.forEach(p => p.x -= diff);
        enemies.forEach(e => e.x -= diff);
    }

    // Sol Sınır
    if (player.x < 0) player.x = 0;

    // Düştü mü? (Oyun Bitti)
    if (player.y > canvas.height + 50) {
        gameOver = true;
    }

    // Platform Çarpışmaları
    player.grounded = false;
    platforms.forEach(p => {
        if (player.x + player.width > p.x &&
            player.x < p.x + p.width &&
            player.y + player.height >= p.y &&
            player.y + player.height - player.dy <= p.y + 12 &&
            player.dy >= 0) {
            player.y = p.y - player.height;
            player.dy = 0;
            player.grounded = true;
        }
    });

    // Saldırı Sayacı
    if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) player.isAttacking = false;
    }

    // Düşman Hareketi ve Çarpışma
    enemies.forEach(e => {
        if (!e.alive) return;
        e.x -= e.speed;

        if (player.x < e.x + e.width &&
            player.x + player.width > e.x &&
            player.y < e.y + e.height &&
            player.y + player.height > e.y) {
            gameOver = true;
        }
    });

    // Temizlik ve Yeni Dünya Üretimi
    platforms = platforms.filter(p => p.x + p.width > -200);
    enemies = enemies.filter(e => e.x + e.width > -200);
    generateNewWorld();
}

function draw() {
    // Bembeyaz Arka Plan
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Platform Kutuları
    ctx.fillStyle = "#000000";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
    });

    // Düşman Kutuları
    enemies.forEach(e => {
        if (e.alive) {
            ctx.fillStyle = e.color;
            ctx.fillRect(e.x, e.y, e.width, e.height);
        }
    });

    // Oyuncu Kutusu
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Saldırı Kutusu
    if (player.isAttacking) {
        ctx.fillStyle = "#ff0000";
        let attackX = player.facing > 0 ? player.x + player.width : player.x - 25;
        ctx.fillRect(attackX, player.y + 10, 25, 20);
    }

    // Skor ve Mesafe
    ctx.fillStyle = "#000000";
    ctx.font = "bold 18px Arial";
    ctx.fillText("Skor: " + score, 20, 30);
    ctx.fillText("Mesafe: " + distance + "m", 20, 55);

    // Game Over
    if (gameOver) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#000000";
        ctx.font = "bold 36px Arial";
        ctx.textAlign = "center";
        ctx.fillText("OYUN BİTTİ", canvas.width / 2, 180);
        ctx.font = "18px Arial";
        ctx.fillText("Yeniden başlamak için sayfayı yenileyin", canvas.width / 2, 220);
        ctx.textAlign = "start";
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
