<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CİVCİV'İN GECE MACERASI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameCanvas {
            background-color: #ffffff;
            border: 2px solid #000000;
            display: block;
            max-width: 100%;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            padding: 15px;
            background-color: #ffffff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            width: 70px;
            height: 70px;
            font-size: 24px;
            font-weight: bold;
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button id="leftBtn">◀</button>
            <button id="rightBtn">▶</button>
        </div>
        <div class="btn-group">
            <button id="jumpBtn">⬆</button>
            <button id="attackBtn">⚔️</button>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- RESİMLER ---
const bgImg = new Image();
bgImg.src = "karanlık arka plan.jpeg";

const playerImg = new Image();
playerImg.src = "WhatsApp Image 2026-10-10 at 18.39.486.jpeg";

const enemy1Img = new Image();
enemy1Img.src = "WhatsApp Image 2026-10-10 at 18.39.47.jpeg";

const enemy2Img = new Image();
enemy2Img.src = "WhatsApp Image 2026-10-10 at 18.39.48.jpeg";

const attackImg = new Image();
attackImg.src = "kılıcarkayk.png";

// 3 Farklı Hasar Efekti (Görseller veya güvenli yedekler)
const hitEffectImgs = [
    new Image(),
    new Image(),
    new Image()
];
hitEffectImgs[0].src = "kılıcarkayk.png";
hitEffectImgs[1].src = "kılıcarkayk.png";
hitEffectImgs[2].src = "kılıcarkayk.png";

// --- WEB AUDIO API (SESLER) ---
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    let now = audioCtx.currentTime;

    if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'attack') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.1);
        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.2);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

let score = 0;
let distance = 0;
let health = 100;
let gameOver = false;
let gameWon = false;
let currentHitEffect = 0;

const player = {
    x: 100,
    y: 200,
    width: 40,
    height: 40,
    dx: 0,
    dy: 0,
    speed: 5,
    jumpPower: -12,
    grounded: false,
    facing: 1,
    isAttacking: false,
    attackTimer: 0,
    invincibleTimer: 0
};

const gravity = 0.6;

let platforms = [
    { x: 0, y: 340, width: 900, height: 60 },
    { x: 350, y: 250, width: 120, height: 20 },
    { x: 600, y: 190, width: 140, height: 20 }
];

let enemies = [
    { x: 500, y: 300, width: 40, height: 40, type: 1, speed: 1.5, alive: true },
    { x: 750, y: 300, width: 40, height: 40, type: 2, speed: 2.0, alive: true }
];

const keys = {};

window.addEventListener("keydown", (e) => {
    initAudio();
    keys[e.code] = true;
    if (e.code === "Space" || e.code === "KeyJ") attack();
});

window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
});

function bindBtn(id, code) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys[code] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[code] = false; });
    btn.addEventListener("mousedown", () => { initAudio(); keys[code] = true; });
    btn.addEventListener("mouseup", () => keys[code] = false);
}

bindBtn("leftBtn", "ArrowLeft");
bindBtn("rightBtn", "ArrowRight");

document.getElementById("jumpBtn").addEventListener("click", () => { initAudio(); jump(); });
document.getElementById("attackBtn").addEventListener("click", () => { initAudio(); attack(); });

function jump() {
    if (player.grounded && !gameOver && !gameWon) {
        player.dy = player.jumpPower;
        player.grounded = false;
        playSound('jump');
    }
}

function attack() {
    if (player.isAttacking || gameOver || gameWon) return;
    player.isAttacking = true;
    player.attackTimer = 12;
    playSound('attack');

    let attackX = player.facing > 0 ? player.x + player.width : player.x - 30;
    let attackWidth = 30;

    enemies.forEach(e => {
        if (e.alive &&
            attackX < e.x + e.width &&
            attackX + attackWidth > e.x &&
            player.y < e.y + e.height &&
            player.y + player.height > e.y) {
            e.alive = false;
            score += 10;
        }
    });
}

function generateNewWorld() {
    if (distance >= 5000) return;

    let lastPlatform = platforms[platforms.length - 1];
    if (lastPlatform && lastPlatform.x < canvas.width + 200) {
        let newX = lastPlatform.x + lastPlatform.width + Math.random() * 80 + 40;
        let newWidth = Math.random() * 200 + 100;
        let newY = Math.random() * 120 + 200;

        if (Math.random() > 0.4) newY = 340;

        platforms.push({ x: newX, y: newY, width: newWidth, height: newY === 340 ? 60 : 20 });

        if (Math.random() > 0.3) {
            let enemyType = Math.random() > 0.5 ? 1 : 2;
            enemies.push({
                x: newX + newWidth / 2,
                y: newY - 40,
                width: 40,
                height: 40,
                type: enemyType,
                speed: Math.random() * 1.5 + 1,
                alive: true
            });
        }
    }
}

function update() {
    if (gameOver || gameWon) return;

    if (player.invincibleTimer > 0) {
        player.invincibleTimer--;
    }

    if (keys["ArrowLeft"] || keys["KeyA"]) {
        player.dx = -player.speed;
        player.facing = -1;
    } else if (keys["ArrowRight"] || keys["KeyD"]) {
        player.dx = player.speed;
        player.facing = 1;
    } else {
        player.dx = 0;
    }

    if ((keys["ArrowUp"] || keys["KeyW"]) && player.grounded) {
        jump();
    }

    player.x += player.dx;
    player.dy += gravity;
    player.y += player.dy;

    if (player.x > 300) {
        let diff = player.x - 300;
        player.x = 300;
        distance += Math.floor(diff / 10);

        platforms.forEach(p => p.x -= diff);
        enemies.forEach(e => e.x -= diff);
    }

    if (player.x < 0) player.x = 0;
    if (player.y > canvas.height + 50) {
        health = 0;
        gameOver = true;
    }

    if (distance >= 5000 && !gameWon) {
        gameWon = true;
    }

    player.grounded = false;
    platforms.forEach(p => {
        if (player.x + player.width > p.x &&
            player.x < p.x + p.width &&
            player.y + player.height >= p.y &&
            player.y + player.height - player.dy <= p.y + 12 &&
            player.dy >= 0) {
            player.y = p.y - player.height;
            player.dy = 0;
            player.grounded = true;
        }
    });

    if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) player.isAttacking = false;
    }

    enemies.forEach(e => {
        if (!e.alive) return;
        e.x -= e.speed;

        if (player.x < e.x + e.width &&
            player.x + player.width > e.x &&
            player.y < e.y + e.height &&
            player.y + player.height > e.y) {
            
            if (player.invincibleTimer === 0) {
                health -= 20;
                player.invincibleTimer = 60;
                playSound('hit');
                currentHitEffect = Math.floor(Math.random() * 3);

                if (health <= 0) {
                    health = 0;
                    gameOver = true;
                }
            }
        }
    });

    platforms = platforms.filter(p => p.x + p.width > -200);
    enemies = enemies.filter(e => e.x + e.width > -200);
    generateNewWorld();
}

function draw() {
    if (bgImg.complete && bgImg.naturalWidth !== 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = "#000000";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
    });

    enemies.forEach(e => {
        if (e.alive) {
            let img = e.type === 1 ? enemy1Img : enemy2Img;
            if (img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, e.x, e.y, e.width, e.height);
            } else {
                ctx.fillStyle = e.type === 1 ? "#008000" : "#ff0000";
                ctx.fillRect(e.x, e.y, e.width, e.height);
            }
        }
    });

    if (player.invincibleTimer % 10 < 5) {
        if (playerImg.complete && playerImg.naturalWidth !== 0) {
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
        } else {
            ctx.fillStyle = "#0000ff";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
    }
    
    // --- KILIÇ VURUŞ EFEKTİ (Düzeltildi: Artık devasa değil, normal boyutlarda) ---
    if (player.isAttacking) {
        let attackX = player.facing > 0 ? player.x + player.width : player.x - 35;
        if (attackImg.complete && attackImg.naturalWidth !== 0) {
            ctx.drawImage(attackImg, attackX, player.y + 5, 35, 30);
        } else {
            ctx.fillStyle = "#ff0000";
            ctx.fillRect(attackX, player.y + 10, 25, 20);
        }
    }

    // ÜST BİLGİLER
    ctx.fillStyle = "#000000";
    ctx.font = "bold 16px Arial";
    ctx.fillText("Skor: " + score, 20, 30);
    ctx.fillText("Mesafe: " + distance + "m / 5000m", 20, 55);

    // Can Barı
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.strokeRect(580, 15, 200, 20);
    ctx.fillStyle = health > 40 ? "#00ff00" : "#ff0000";
    ctx.fillRect(580, 15, (health / 100) * 200, 20);
    ctx.fillStyle = "#000000";
    ctx.fillText("Can: " + health + "%", 630, 31);

    // Rastgele Hasar Efekti (3 çeşit)
    if (player.invincibleTimer > 45) {
        let effImg = hitEffectImgs[currentHitEffect];
        if (effImg.complete && effImg.naturalWidth !== 0) {
            ctx.drawImage(effImg, player.x - 10, player.y - 10, 60, 60);
        }
    }

    // GAME OVER EKRANI VE YENİDEN DENE BUTONU
    if (gameOver) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#FF0000";
        ctx.font = "bold 36px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 140);

        // Yeniden Dene Butonu
        ctx.fillStyle = "#000000";
        ctx.fillRect(canvas.width / 2 - 100, 180, 200, 50);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Arial";
        ctx.fillText("YENİDEN DENE", canvas.width / 2, 212);
        ctx.textAlign = "start";
    }

    // KAZANDIN EKRANI VE DEVAM EDİLECEK BUTONU
    if (gameWon) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ff00";
        ctx.font = "bold 36px Arial";
        ctx.textAlign = "center";
        ctx.fillText("KAZANDIN!", canvas.width / 2, 140);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Arial";
        ctx.fillText("Kaleye ulaştın!", canvas.width / 2, 190);

        // Devam Edilecek Butonu
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(canvas.width / 2 - 100, 230, 200, 50);
        ctx.fillStyle = "#000000";
        ctx.font = "bold 18px Arial";
        ctx.fillText("DEVAM EDİLECEK", canvas.width / 2, 262);
        ctx.textAlign = "start";
    }
}

// Buton Tıklama Koordinatları (Game Over ve Kazandın butonları)
canvas.addEventListener("click", (e) => {
    let rect = canvas.getBoundingClientRect();
    let mouseX = e.clientX - rect.left;
    let mouseY = e.clientY - rect.top;

    if (gameOver) {
        if (mouseX >= canvas.width / 2 - 100 && mouseX <= canvas.width / 2 + 100 &&
            mouseY >= 180 && mouseY <= 230) {
            resetGame();
        }
    } else if (gameWon) {
        if (mouseX >= canvas.width / 2 - 100 && mouseX <= canvas.width / 2 + 100 &&
            mouseY >= 230 && mouseY <= 280) {
            gameWon = false;
            distance += 1;
        }
    }
});

function resetGame() {
    score = 0;
    distance = 0;
    health = 100;
    gameOver = false;
    gameWon = false;
    player.x = 100;
    player.y = 200;
    player.dx = 0;
    player.dy = 0;
    platforms = [
        { x: 0, y: 340, width: 900, height: 60 },
        { x: 350, y: 250, width: 120, height: 20 },
        { x: 600, y: 190, width: 140, height: 20 }
    ];
    enemies = [
        { x: 500, y: 300, width: 40, height: 40, type: 1, speed: 1.5, alive: true },
        { x: 750, y: 300, width: 40, height: 40, type: 2, speed: 2.0, alive: true }
    ];
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
